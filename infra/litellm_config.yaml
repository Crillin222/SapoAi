model_list:
  # Maestro: General Reasoning & Routing (Llama 3.1 8B)
  - model_name: sapo-maestro
    litellm_params:
      model: openai/sapo-maestro
      api_base: http://host.docker.internal:8080/v1
      api_key: sk-ignored
      temperature: 0.2
      max_tokens: 4096

  # General: Fast Chat & Creative Tasks (Qwen 2.5 7B)
  - model_name: sapo-general
    litellm_params:
      model: openai/sapo-general
      api_base: http://host.docker.internal:8081/v1
      api_key: sk-ignored
      temperature: 0.7 # Slightly higher for creativity
      max_tokens: 4096

  # Coder: Logic, Automation & Scripts (Qwen 2.5 Coder 7B/32B)
  - model_name: sapo-coder
    litellm_params:
      model: openai/sapo-coder
      api_base: http://host.docker.internal:8082/v1
      api_key: sk-ignored
      temperature: 0.0 # Deterministic for logic
      frequency_penalty: 0.05
      max_tokens: 8192

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  set_verbose: true
  disable_token_counter: true 

general_settings:
  master_key: sk-sapo-123 
