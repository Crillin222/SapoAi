model_list:
  # Reasoning/Chat Model
  - model_name: sapo-chat
    litellm_params:
      model: openai/sapo-chat
      api_base: http://host.docker.internal:8080/v1
      api_key: sk-ignored
      temperature: 0.2
      max_tokens: 4096

  # Coding/Task Model
  - model_name: sapo-code
    litellm_params:
      model: openai/sapo-code
      api_base: http://host.docker.internal:8081/v1
      temperature: 0.0
      frequency_penalty: 0.05
      max_tokens: 8192

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  set_verbose: true

general_settings:
  master_key: sk-sapo-admin-123
  database_type: redis
